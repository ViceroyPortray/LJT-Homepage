name: Enable GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  administration: write
jobs:
  enable:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      administration: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            try {
              const { data } = await github.rest.repos.createPagesSite({
                owner: context.repo.owner,
                repo: context.repo.repo,
                source: {
                  branch: 'master',
                  path: '/'
                }
              })
              console.log('Pages enabled:', JSON.stringify(data))
            } catch (e) {
              console.log('Error enabling Pages:', e.message)
              throw e
            }
